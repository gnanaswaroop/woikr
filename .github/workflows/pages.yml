name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install -r tools/requirements.txt
      - name: Prepare images (card thumbnails, shrink oversized uploads)
        run: |
          python tools/make_thumbs.py
          python tools/optimize_images.py
      - name: Build
        working-directory: site
        # GA4 ID comes from the repo variable GA_MEASUREMENT_ID (Settings > Secrets and variables > Actions > Variables).
        # Unset/empty = analytics disabled.
        env:
          HUGO_PARAMS_GAMEASUREMENTID: ${{ vars.GA_MEASUREMENT_ID }}
        run: hugo --minify --destination ../_site
      - name: Performance budget check
        run: python tools/check_budgets.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
