baseURL = "https://woikr.com/"
title = "woikr"
disableKinds = ["sitemap"]
enableRobotsTXT = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # archived post bodies are HTML and are rendered as-is

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

[params]
  description = "Gadgets, reviews, tricks and more. An archive of woikr.com."
  logo = "/images/woikr-logo.png"

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 2

# WordPress-compatible taxonomy URLs (old site used /category/<slug>/ and /tag/<slug>/)
[permalinks]
  [permalinks.taxonomy]
    categories = "/category/"
    tags = "/tag/"
  [permalinks.term]
    categories = "/category/:slug/"
    tags = "/tag/:slug/"
    authors = "/author/:slug/"
