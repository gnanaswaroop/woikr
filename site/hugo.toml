baseURL = "https://woikr.com/"
title = "woikr"

enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # archived post bodies are HTML and are rendered as-is

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

[params]
  description = "Gadgets, reviews, tricks and more. Welcome to woikr.com."
  tagline = "Gadgets, Reviews, Tricks and More"
  logo = "/images/woikr-logo.png"
  # Google Analytics 4 measurement ID (e.g. "G-XXXXXXXXXX"). Leave empty to disable analytics entirely.
  gaMeasurementId = ""

[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 2

# WordPress-compatible taxonomy URLs (old site used /category/<slug>/ and /tag/<slug>/)
[permalinks]
  [permalinks.taxonomy]
    categories = "/category/"
    tags = "/tag/"
  [permalinks.term]
    categories = "/category/:slug/"
    tags = "/tag/:slug/"
    authors = "/author/:slug/"
