<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ site.Params.description }}">
  <link rel="icon" href="{{ site.Params.logo }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v=2">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="{{ "/" | relURL }}"><img src="{{ site.Params.logo | relURL }}" alt="woikr" width="214" height="57"></a>
      <nav>
        {{ range site.Menus.main }}<a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
