{{- with site.Params.gaMeasurementId }}
<div id="analytics-consent" class="consent-banner" role="region" aria-label="Analytics consent" hidden>
  <p>We'd like to use Google Analytics to count visits and see which pages are popular. It is off unless you accept. You can change your choice any time from the footer.</p>
  <div class="consent-actions">
    <button type="button" class="consent-accept" data-consent="granted">Accept analytics</button>
    <button type="button" class="consent-decline" data-consent="denied">No thanks</button>
  </div>
</div>
<script src="{{ "/js/analytics-consent.js" | relURL }}" data-ga-id="{{ . }}" defer></script>
{{- end }}
